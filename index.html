        let employeeRegistry = [];

        function createCard(emp) {
            const id = employeeRegistry.length;
            employeeRegistry.push(emp);

            return `
                <div class="card" onclick="openModal(${id})">
                    <div class="avatar-container">
                        <img src="${emp.img}" alt="${emp.name}" class="avatar-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="avatar-fallback" style="display: none;">👤</div>
                    </div>
                    <div class="name">${emp.name}</div>
                    <div class="role">${emp.role}</div>
                </div>
            `;
        }

        function renderChart() {
            const root = document.getElementById('chart-root');
            let html = '';

            html += `<div class="level-row">${staffData.directors.map(createCard).join('')}</div>`;

            html += `
                <div class="company-section">
                    <div class="company-badge">${staffData.nbtBase.companyName}</div>
                    <div class="branch-row">
                        ${staffData.nbtBase.branches.map(branch => `
                            <div class="sub-branch">
                                ${createCard(branch.manager)}
                                <div class="grid-subs">
                                    ${branch.staff.map(createCard).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            html += `<div class="branch-row" style="margin-top: 20px;">`;
            staffData.subsidiaries.forEach(sub => {
                html += `
                    <div class="company-section" style="width: 48%; box-sizing: border-box;">
                        <div class="company-badge">${sub.companyName}</div>
                        ${createCard(sub.manager)}
                        <div class="grid-subs" style="margin-top: 30px;">
                            ${sub.staff.map(createCard).join('')}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            root.innerHTML = html;
        }

        function openModal(empId) {
            const emp = employeeRegistry[empId];
            
            document.getElementById('modal-name').innerText = emp.name;
            document.getElementById('modal-role').innerHTML = emp.role.replace('<br>', ' ');
            
            const imgContainer = document.getElementById('modal-image-container');
            imgContainer.innerHTML = `<img src="${emp.img}" class="modal-avatar" onerror="this.style.display='none';">`;
            
            const eduElement = document.getElementById('modal-edu');
            if (emp.education) {
                eduElement.innerText = emp.education;
                eduElement.style.display = 'block';
                eduElement.style.marginBottom = emp.university ? '5px' : '30px'; 
            } else {
                eduElement.style.display = 'none';
            }

            const uniElement = document.getElementById('modal-uni');
            if (emp.university) {
                uniElement.innerText = emp.university;
                uniElement.style.display = 'block';
            } else {
                uniElement.style.display = 'none';
            }
            
            const descContainer = document.getElementById('modal-desc-container');
            let descHtml = '';

            if (emp.scopes || emp.tasks) {
                if (emp.scopes && emp.scopes.length > 0) {
                    descHtml += '<h4 class="section-title">Scope</h4><ul class="modal-list">';
                    emp.scopes.forEach(item => { descHtml += `<li>${item}</li>`; });
                    descHtml += '</ul>';
                }
                if (emp.tasks && emp.tasks.length > 0) {
                    descHtml += '<h4 class="section-title">Task</h4><ul class="modal-list">';
                    emp.tasks.forEach(item => { descHtml += `<li>${item}</li>`; });
                    descHtml += '</ul>';
                }
            } else if (emp.desc) {
                descHtml += `<h4 class="section-title">Overview</h4><p class="modal-paragraph">${emp.desc}</p>`;
            }

            descContainer.innerHTML = descHtml;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target == modal) {
                closeModal();
            }
        }

        renderChart();
    </script>
